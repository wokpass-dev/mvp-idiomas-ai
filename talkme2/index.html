    .glass {

      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .chat-shadow {
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);

    @keyframes fadeInUp {

      }

        transform: translateY(0);
      }
    }

      animation: fadeInUp 0.3s ease-out;
    }
